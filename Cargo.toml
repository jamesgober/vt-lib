# =============================================================================
#  R E P S   ·   vt-lib
# =============================================================================
[package]
name    = "vt-lib"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Terminal emulation core: VT/xterm escape parser, screen grid, scrollback, reflow, selection, damage tracking, and key encoding."

# Keywords (5 max)
keywords = ["terminal", "vt100", "xterm", "emulator", "ansi"]

# Categories
categories = ["command-line-interface", "parser-implementations", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/vt-lib"
repository    = "https://github.com/jamesgober/vt-lib"
documentation = "https://docs.rs/vt-lib"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "vt_lib"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
std = []


# DEPENDENCIES
# #################################
[dependencies]
# First-party -lang dependencies are wired at v0.2.0, when first used.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
